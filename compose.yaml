services:
  app:
    build: .
    container_name: portfolio-site
    ports:
      - "3000:3000"
    volumes:
      # ホストのソースをマウントしてホットリロード
      - .:/app
      # node_modules と .next はコンテナ内のものを使う（ホスト側で上書きしない）
      - /app/node_modules
      - /app/.next
    environment:
      # webpack(watchpack)利用時のファイル監視フォールバック用。
      # Next.js 16 は Turbopack がデフォルトでこの変数を参照しないが、
      # `next dev --webpack` に切り替えた場合の保険として残す。
      - WATCHPACK_POLLING=true
    command: npm run dev
